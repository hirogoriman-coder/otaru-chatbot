<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1D9E75">
<title>Otaru Travel Guide</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; height: 100dvh; font-family: 'DM Sans', sans-serif; background: #f0fdf8; overflow: hidden; }

  /* ===== パスワード画面 ===== */
  .pw-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; height: 100dvh;
    background: linear-gradient(160deg, #0d2a18 0%, #1a4a28 50%, #0a1f12 100%);
    padding: 2rem;
  }
  .pw-logo { font-size: 56px; margin-bottom: 12px; filter: drop-shadow(0 0 20px rgba(29,158,117,0.6)); }
  .pw-title { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; color: #fff; margin-bottom: 4px; text-align: center; }
  .pw-subtitle { font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 32px; letter-spacing: 2px; text-align: center; }
  .pw-card {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(29,158,117,0.3);
    border-radius: 16px; padding: 28px 24px; width: 100%; max-width: 340px;
  }
  .pw-label { font-size: 12px; color: rgba(255,255,255,0.6); letter-spacing: 2px; margin-bottom: 10px; }
  .pw-input {
    width: 100%; padding: 14px 16px; font-size: 16px; font-family: 'DM Sans', sans-serif;
    border: 1.5px solid rgba(29,158,117,0.4); border-radius: 10px; outline: none;
    background: rgba(255,255,255,0.08); color: #fff; letter-spacing: 3px;
    text-align: center; margin-bottom: 12px; -webkit-appearance: none;
  }
  .pw-input::placeholder { color: rgba(255,255,255,0.25); letter-spacing: 1px; }
  .pw-input:focus { border-color: #1D9E75; background: rgba(29,158,117,0.1); }
  .pw-btn {
    width: 100%; padding: 14px; background: #1D9E75; color: #fff; border: none;
    border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer;
    font-family: 'DM Sans', sans-serif; letter-spacing: 1px; -webkit-appearance: none;
  }
  .pw-btn:active { background: #178a64; transform: scale(0.98); }
  .pw-error { font-size: 12px; color: #ff6b6b; text-align: center; margin-top: 10px; min-height: 18px; }
  .pw-info { font-size: 11px; color: rgba(255,255,255,0.3); text-align: center; margin-top: 20px; line-height: 1.6; }

  /* ===== チャット画面 ===== */
  .app { display: flex; flex-direction: column; height: 100%; height: 100dvh; max-width: 600px; margin: 0 auto; background: #fff; }
  .header { background: linear-gradient(135deg, #1D9E75 0%, #0F6E56 100%); padding: 14px 16px 10px; flex-shrink: 0; padding-top: max(14px, env(safe-area-inset-top)); }
  .header-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .header-title h1 { font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 700; color: #fff; }
  .header-title p { font-size: 11px; color: rgba(255,255,255,0.8); margin-top: 1px; }
  .lang-pills { margin-left: auto; display: flex; gap: 5px; }
  .lang-pill { font-size: 11px; padding: 4px 10px; border-radius: 20px; border: 1.5px solid rgba(255,255,255,0.4); color: rgba(255,255,255,0.85); cursor: pointer; background: transparent; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
  .lang-pill.active { background: #fff; color: #1D9E75; border-color: #fff; font-weight: 500; }
  .quick-topics { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .quick-topics::-webkit-scrollbar { display: none; }
  .topic-btn { font-size: 11px; padding: 4px 11px; border-radius: 20px; border: 1.5px solid rgba(255,255,255,0.4); color: rgba(255,255,255,0.9); background: transparent; cursor: pointer; white-space: nowrap; font-family: 'DM Sans', sans-serif; }
  .topic-btn:active { background: rgba(255,255,255,0.2); }
  .messages { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }
  .msg { display: flex; align-items: flex-end; gap: 7px; }
  .msg.user { flex-direction: row-reverse; }
  .msg-avatar { width: 26px; height: 26px; border-radius: 50%; background: #1D9E75; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; color: #fff; }
  .msg.user .msg-avatar { background: #dbeafe; color: #1e40af; font-size: 9px; font-weight: 500; }
  .bubble { max-width: 80%; padding: 10px 13px; font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .msg.bot .bubble { background: #f4f7f6; border-radius: 16px 16px 16px 4px; color: #1a202c; }
  .msg.user .bubble { background: #1D9E75; color: #fff; border-radius: 16px 16px 4px 16px; }
  .typing { display: flex; align-items: center; gap: 5px; padding: 4px 0; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: #9ca3af; animation: bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-7px)} }
  .input-area { flex-shrink: 0; padding: 10px 12px; padding-bottom: max(10px, env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid #f0f4f2; display: flex; gap: 8px; align-items: center; }
  .chat-input { flex: 1; padding: 10px 14px; font-size: 15px; font-family: 'DM Sans', sans-serif; border: 1.5px solid #d1fae5; border-radius: 24px; outline: none; background: #f0fdf8; color: #1a202c; -webkit-appearance: none; }
  .chat-input:focus { border-color: #1D9E75; background: #fff; }
  .send-btn { width: 42px; height: 42px; border-radius: 50%; background: #1D9E75; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .send-btn:active { background: #178a64; transform: scale(0.96); }
  .send-btn svg { width: 16px; height: 16px; }
</style>
</head>
<body>

<!-- パスワード画面 -->
<div class="pw-screen" id="pwScreen">
  <div class="pw-logo">⛵</div>
  <div class="pw-title">Otaru Travel Guide</div>
  <div class="pw-subtitle">小樽観光 AI ガイド</div>
  <div class="pw-card">
    <div class="pw-label">ACCESS CODE / 访问码 / 액세스 코드</div>
    <input class="pw-input" id="pwInput" type="text" placeholder="Enter your code" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" onkeydown="if(event.key==='Enter')checkPw()" />
    <button class="pw-btn" onclick="checkPw()">Enter / 进入 / 입장</button>
    <div class="pw-error" id="pwError"></div>
  </div>
  <div class="pw-info">
    このサービスは有料アクセスコードが必要です。<br>
    This service requires a paid access code.<br>
    需要付费访问码才能使用此服务。
  </div>
</div>

<!-- チャット画面（初期非表示） -->
<div class="app" id="chatApp" style="display:none;">
  <div class="header">
    <div class="header-top">
      <div class="avatar">⛵</div>
      <div class="header-title">
        <h1>Otaru Travel Guide</h1>
        <p>AI-powered · Hokkaido, Japan</p>
      </div>
      <div class="lang-pills">
        <button class="lang-pill active" onclick="setLang('en')">EN</button>
        <button class="lang-pill" onclick="setLang('zh')">中文</button>
        <button class="lang-pill" onclick="setLang('ko')">한국어</button>
      </div>
    </div>
    <div class="quick-topics" id="quickTopics"></div>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-area">
    <input class="chat-input" id="chatInput" placeholder="Ask me about Otaru..." onkeydown="handleKey(event)" autocomplete="off" autocorrect="off" spellcheck="false" />
    <button class="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</div>

<script>
// ===== パスワード設定 =====
// 月ごとに変更してください
const VALID_PASSWORDS = [
  'OTARU-2026-03',  // 2026年3月
  'OTARU-2026-04',  // 2026年4月
  'OTARU-2026-05',  // 2026年5月
  'OTARU-2026-06',  // 2026年6月
];

function checkPw() {
  const input = document.getElementById('pwInput').value.trim().toUpperCase();
  const error = document.getElementById('pwError');
  if (VALID_PASSWORDS.includes(input)) {
    sessionStorage.setItem('otaru_auth', input);
    document.getElementById('pwScreen').style.display = 'none';
    document.getElementById('chatApp').style.display = 'flex';
    renderTopics();
    setTimeout(() => addMessage('bot', LANGS[currentLang].greeting), 300);
  } else {
    error.textContent = '❌ Invalid code. Please check and try again.';
    document.getElementById('pwInput').value = '';
    setTimeout(() => error.textContent = '', 3000);
  }
}

// セッション中は再入力不要
if (sessionStorage.getItem('otaru_auth') && VALID_PASSWORDS.includes(sessionStorage.getItem('otaru_auth'))) {
  document.getElementById('pwScreen').style.display = 'none';
  document.getElementById('chatApp').style.display = 'flex';
}

// ===== チャット =====
const LANGS = {
  en: { placeholder: "Ask me about Otaru...", greeting: "Hello! 👋 I'm your Otaru travel guide. Ask me about sightseeing, food, transport, or shopping!", topics: ["🏛 Sights", "🍜 Food", "🚃 Transport", "🛍 Shopping"] },
  zh: { placeholder: "问我关于小樽的问题...", greeting: "您好！👋 我是您的小樽旅行向导。请问我关于景点、美食、交通或购物的问题！", topics: ["🏛 景点", "🍜 美食", "🚃 交通", "🛍 购物"] },
  ko: { placeholder: "오타루에 대해 물어보세요...", greeting: "안녕하세요! 👋 오타루 여행 가이드입니다. 명소, 음식, 교통, 쇼핑 무엇이든 물어보세요!", topics: ["🏛 명소", "🍜 음식", "🚃 교통", "🛍 쇼핑"] }
};

let currentLang = 'en', conversationHistory = [], isTyping = false;

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-pill').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.lang-pill')[lang==='en'?0:lang==='zh'?1:2].classList.add('active');
  document.getElementById('chatInput').placeholder = LANGS[lang].placeholder;
  renderTopics();
}

function renderTopics() {
  const c = document.getElementById('quickTopics'); c.innerHTML = '';
  LANGS[currentLang].topics.forEach(t => {
    const b = document.createElement('button'); b.className = 'topic-btn'; b.textContent = t;
    b.onclick = () => { document.getElementById('chatInput').value = t.replace(/^\S+\s/, ''); sendMessage(); };
    c.appendChild(b);
  });
}

function addMessage(role, text) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div'); div.className = `msg ${role}`;
  const av = document.createElement('div'); av.className = 'msg-avatar'; av.textContent = role==='bot'?'⛵':'YOU';
  const bub = document.createElement('div'); bub.className = 'bubble'; bub.textContent = text;
  div.appendChild(av); div.appendChild(bub); msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div'); div.className = 'msg bot'; div.id = 'typingIndicator';
  const av = document.createElement('div'); av.className = 'msg-avatar'; av.textContent = '⛵';
  const bub = document.createElement('div'); bub.className = 'bubble';
  bub.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  div.appendChild(av); div.appendChild(bub); msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping() { const el = document.getElementById('typingIndicator'); if(el) el.remove(); }
function handleKey(e) { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} }

async function sendMessage() {
  if(isTyping) return;
  const input = document.getElementById('chatInput');
  const text = input.value.trim(); if(!text) return;
  input.value = ''; addMessage('user', text);
  conversationHistory.push({role:'user', content:text});
  isTyping = true; showTyping();
  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({messages: conversationHistory, lang: currentLang})
    });
    const data = await response.json();
    if(!response.ok) throw new Error(data.error||'Error');
    removeTyping(); addMessage('bot', data.text);
    conversationHistory.push({role:'assistant', content:data.text});
  } catch(err) {
    removeTyping(); addMessage('bot', '⚠️ '+err.message);
    conversationHistory.pop();
  }
  isTyping = false;
}
</script>
</body>
</html>
